services:
  - type: web
    name: exorcity
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # Set manually in Render dashboard (from Supabase)
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true  # Render auto-generates a random value
      - key: JWT_EXPIRATION_MINUTES
        value: "720"
      - key: CORS_ALLOWED_ORIGINS
        sync: false          # Set to your Netlify URL after frontend deploys
      - key: PORT
        value: "8080"
      - key: SEED_DEMO_DATA
        value: "true"
