# Render Blueprint: one-click backend + PostgreSQL.
# Dashboard → New → Blueprint → pick this repo. Then set CORS_ALLOWED_ORIGINS to your frontend URL.
databases:
  - name: exorcity-db
    plan: free
    databaseName: exorcity
    user: exorcity

services:
  - type: web
    name: exorcity-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # postgres://… is converted to JDBC by the app
        fromDatabase:
          name: exorcity-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MINUTES
        value: "720"
      - key: CORS_ALLOWED_ORIGINS
        sync: false                # e.g. https://exorcity.netlify.app
      - key: CLOUDINARY_URL
        sync: false                # optional
      - key: SEED_DEMO_DATA
        value: "true"
