<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exorcity title card</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0f; color: #e8e6e3; font-family: Inter, sans-serif; overflow: hidden; }
  .stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .fog { position: absolute; inset: -20% -50%; pointer-events: none;
    background: radial-gradient(ellipse at 20% 60%, rgba(232,230,227,.10), transparent 55%),
                radial-gradient(ellipse at 70% 40%, rgba(232,230,227,.08), transparent 50%),
                radial-gradient(ellipse at 45% 80%, rgba(57,255,20,.05), transparent 50%);
    animation: drift 14s ease-in-out infinite; }
  .fog.b { animation-duration: 20s; animation-direction: reverse; }
  @keyframes drift { 0%,100% { transform: translateX(-8%); } 50% { transform: translateX(8%); } }
  .kicker { letter-spacing: .35em; text-transform: uppercase; color: #a8a6a3; font-weight: 600; font-size: 22px; }
  h1 { font-family: Creepster, cursive; font-weight: 400; font-size: 210px; margin: 10px 0; color: #ff6b00;
    text-shadow: 0 0 40px rgba(255,107,0,.55); animation: rise 1.6s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px) scale(.96); filter: blur(6px); } to { opacity: 1; transform: none; filter: none; } }
  .tag { font-size: 40px; max-width: 1100px; animation: rise 1.6s .5s ease-out both; }
  .tag b { color: #39ff14; font-weight: 600; }
  .monsters { margin-top: 50px; font-size: 64px; display: flex; gap: 44px; animation: rise 1.6s 1s ease-out both; }
  .monsters span { display: inline-block; animation: bob 2.6s ease-in-out infinite; }
  .monsters span:nth-child(2) { animation-delay: .3s } .monsters span:nth-child(3) { animation-delay: .6s }
  .monsters span:nth-child(4) { animation-delay: .9s } .monsters span:nth-child(5) { animation-delay: 1.2s }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
</style>
</head>
<body>
  <div class="stage">
    <div class="fog"></div><div class="fog b"></div>
    <div class="kicker">Kiroween 2026 · Costume Contest</div>
    <h1>Exorcity</h1>
    <div class="tag">Your city is haunted by garbage. <b>Exorcise it</b>, and get rewarded.</div>
    <div class="monsters" aria-hidden="true"><span>🧟</span><span>👹</span><span>👻</span><span>🕷️</span><span>🐸</span></div>
  </div>
</body>
</html>
