<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exorcity outro</title>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0f; color: #e8e6e3; font-family: Inter, sans-serif; overflow: hidden; }
  .stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 22px; }
  .fog { position: absolute; inset: -20% -50%; pointer-events: none;
    background: radial-gradient(ellipse at 30% 50%, rgba(232,230,227,.09), transparent 55%),
                radial-gradient(ellipse at 70% 60%, rgba(57,255,20,.06), transparent 50%);
    animation: drift 16s ease-in-out infinite; }
  @keyframes drift { 0%,100% { transform: translateX(-6%); } 50% { transform: translateX(6%); } }
  .sparkle { font-size: 90px; animation: glow 2s ease-in-out infinite; }
  @keyframes glow { 0%,100% { filter: drop-shadow(0 0 10px #39ff14); } 50% { filter: drop-shadow(0 0 30px #39ff14); } }
  h1 { font-family: Creepster, cursive; font-weight: 400; font-size: 150px; margin: 0; color: #ff6b00; text-shadow: 0 0 40px rgba(255,107,0,.5); }
  .tag { font-size: 36px; } .tag b { color: #39ff14; }
  .url { margin-top: 26px; font-size: 30px; color: #ff8a3d; font-weight: 600; }
  .demo { font-size: 24px; color: #a8a6a3; }
  .demo code { color: #e8e6e3; }
</style>
</head>
<body>
  <div class="stage">
    <div class="fog"></div>
    <div class="sparkle" aria-hidden="true">✨</div>
    <h1>Exorcity</h1>
    <div class="tag">Your city is haunted by garbage. <b>Exorcise it</b>, and get rewarded.</div>
    <div class="url">github.com/shastrig50/exorcity</div>
    <div class="demo">Demo login: any role · password <code>Demo@123</code> · Spring Boot · Angular · Leaflet · built with Kiro</div>
  </div>
</body>
</html>
