[build]
  base    = "frontend"
  publish = "dist/frontend/browser"
  # API_URL must be set in Netlify → Site settings → Environment variables.
  # e.g. API_URL = https://exorcity.onrender.com/api
  command = "sed -i 's|__API_URL__|'\"$API_URL\"'|g' src/environments/environment.prod.ts && npm run build"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
