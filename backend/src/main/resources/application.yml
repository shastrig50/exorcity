server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: exorcity
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/exorcity}
    username: ${DB_USERNAME:exorcity}
    password: ${DB_PASSWORD:exorcity}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

exorcity:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  jwt:
    # Local-only default. Always set JWT_SECRET (>= 32 chars) in any deployed environment.
    secret: ${JWT_SECRET:local-dev-only-secret-change-me-please-32chars}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  cloudinary-url: ${CLOUDINARY_URL:}
  seed:
    enabled: ${SEED_DEMO_DATA:true}
  jobs:
    enabled: true
    overdue-cron: "0 0 2 * * *"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
